name: Bug report
description: Report a reproducible CHRONOS problem
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Start...\n2. Open...\n3. Click..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or VERSION
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, and browser versions
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data mode
      options:
        - Portable checked-in evidence only
        - Full raw MaleCNS tables installed
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove credentials and personal paths before posting.
